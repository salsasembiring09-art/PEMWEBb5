<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body{
            background: linear-gradient(135deg, #fff0f5, #ffe4ec, #fdf6f0);
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: #5a3e36;
        }

        header{
            padding: 40px 20px 20px;
        }

        h1{
            color: #d6336c;
            text-align: center;
            font-family: 'Comic Sans MS', cursive;
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #ffd6e8;
        }

        nav{
            text-align: center;
        }

        nav a{
            color: #ff5c8a;
            font-weight: bold;
            text-decoration: none;
            margin: 0 12px;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 3px 8px rgba(255, 105, 180, 0.25);
            transition: all 0.3s ease;
            display: inline-block;
        }

        nav a:hover{
            background-color: #ff5c8a;
            color: #fff;
            transform: translateY(-3px);
        }

        main{
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        section{
            background-color: #fff;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 6px 16px rgba(255, 182, 193, 0.35);
            text-align: center;
        }

        section h2{
            color: #d6336c;
            font-family: 'Comic Sans MS', cursive;
        }

        section img{
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1> PROJECT SAYA </h1>
        <nav>
            <a href="#Home">Home</a>
            <a href="#About">About</a>
            <a href="portofolio.html">Portofolio</a>
            <a href="#Contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="project1">
            <h2>Project 1</h2>
            <img src="OIP.jpg" alt="OIP">
        </section>
    </main>

</body>
</html>
